<ion-content [fullscreen]="true" class="welcome-content">
  <main class="welcome-page">
    <section class="welcome-panel" aria-labelledby="welcome-title">
      <p class="eyebrow">KICKSTART SOCCER</p>
      <h1 id="welcome-title">Welcome to<br />KickStart Soccer!</h1>
      <p class="prompt">Who are you?</p>

      <div class="role-options" aria-label="Choose your role">
        @for (role of roles; track role.id) {
          <button
            class="role-option"
            type="button"
            [class.selected]="selectedRole() === role.id"
            [attr.aria-pressed]="selectedRole() === role.id"
            (click)="selectRole(role.id)"
          >
            <span class="role-icon" aria-hidden="true"></span>
            <span class="role-copy">
              <span class="role-name">{{ role.label }}</span>
              <span class="role-description">{{ role.description }}</span>
            </span>
          </button>
        }
      </div>

      <p class="selection-status" role="status" aria-live="polite">
        @if (selectedRole(); as roleId) {
          {{ roleLabel(roleId) }} selected
        } @else {
          Select a role to get started.
        }
      </p>

      <div class="progress" aria-label="Onboarding step 1 of 3">
        <span class="progress-dot active"></span>
        <span class="progress-dot"></span>
        <span class="progress-dot"></span>
      </div>
    </section>
  </main>
</ion-content>
