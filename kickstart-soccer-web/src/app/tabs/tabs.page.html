<div class="tabs-shell" [class.coach-layout]="isCoach()">
  @if (isCoach()) {
    <nav class="coach-sidebar" aria-label="Coach navigation">
      <a class="brand" routerLink="/dashboard">KICKSTART <span>SOCCER</span></a>
      <div class="sidebar-links">
        @for (item of coachNavigation; track item.label) {
          <a
            [routerLink]="item.path.split('#')[0]"
            [fragment]="item.path.includes('#') ? item.path.split('#')[1] : undefined"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path !== '/dashboard' }"
          >
            <ion-icon aria-hidden="true" [name]="item.icon"></ion-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>
  }

  <ion-tabs>
    <ion-tab-bar slot="bottom" aria-label="Main navigation">
      @for (item of mobileItems(); track item.path) {
        <ion-tab-button [tab]="item.path.slice(1)" [href]="item.path">
          <ion-icon aria-hidden="true" [name]="item.icon"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  </ion-tabs>
</div>
